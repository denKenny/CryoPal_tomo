[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryopal-tomo"
dynamic = ["version"]
description = "Project-centred desktop orchestration and provenance for cryo-electron tomography workflows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
authors = [{name = "Kenneth Ehses"}]
keywords = ["cryo-ET", "electron tomography", "RELION", "Slurm", "research software"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
validation = [
  "mrcfile>=1.5,<2",
  "starfile>=0.5,<1",
]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mrcfile>=1.5,<2",
  "mypy>=1.11,<2",
  "ruff>=0.8,<1",
  "starfile>=0.5,<1",
]
docs = ["python-docx>=1.1,<2"]

[project.gui-scripts]
cryopal-tomo = "cryoet_organizer.main:main"

[project.scripts]
cryopal-tomo-doctor = "cryoet_organizer.main:doctor_main"

[project.urls]
Homepage = "https://github.com/denKenny/CryoPal_tomo"
Repository = "https://github.com/denKenny/CryoPal_tomo"
Issues = "https://github.com/denKenny/CryoPal_tomo/issues"

[tool.setuptools.dynamic]
version = {attr = "cryoet_organizer.__version__"}

[tool.setuptools.packages.find]
include = ["cryoet_organizer*"]

[tool.setuptools.package-data]
cryoet_organizer = ["assets/*.png", "data/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["cryoet_organizer"]

[tool.coverage.report]
show_missing = true
fail_under = 23
