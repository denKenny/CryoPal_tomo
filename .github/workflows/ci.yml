name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate runtime
        run: python -m cryoet_organizer.main doctor
      - name: Smoke-test Tk window creation
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Compile sources
        run: python -m compileall -q cryoet_organizer benchmarks
      - name: Check critical lint rules
        run: ruff check cryoet_organizer tests
      - name: Type-check scientific and persistence core
        run: >-
          mypy cryoet_organizer/star_merge.py cryoet_organizer/project.py
          cryoet_organizer/safe_delete.py cryoet_organizer/slurm.py
          cryoet_organizer/job_execution.py cryoet_organizer/extraction_mask.py
          cryoet_organizer/mrc_preview.py --ignore-missing-imports --follow-imports=skip
      - name: Run tests with branch coverage
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=23
      - name: Build distributions
        run: python -m build
